# Construit le site (tools/build_site.py) et le publie sur GitHub Pages.
# Prérequis, une seule fois : Settings > Pages > Build and deployment > Source : GitHub Actions.
name: Publier le site

on:
  push:
    branches: [main, "claude/beautiful-goldberg-x0to5u"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construire le site
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
