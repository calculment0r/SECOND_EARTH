<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Second Earth · Brief de reprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: only light;
  --bg:#f1f1f4; --bg2:#ffffff; --bg3:#e7e7ec; --field:#fafafc;
  --line:#d8d8e0; --line2:#bcbcca;
  --ink:#0d0d11; --muted:#55556a; --dim:#8b8b9f;
  --or:#ff5200; --or-soft:#fff0e8; --or-line:#ffb48f;
  --ok:#2c7a4b; --ok-soft:#e6f3eb;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{background-color:var(--bg)!important;color:var(--ink)}
html{scroll-padding-top:16px}
body{margin:0;font-family:var(--serif);font-size:19px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;background-color:var(--bg);z-index:-1}
.shell,aside,main,header,section,footer,.wrap,nav{background-color:var(--bg)}
@media (prefers-color-scheme:dark){
  html,body{background-color:var(--bg)!important;color:var(--ink)}
  .shell,aside,main,header,section,footer,.wrap,nav{background-color:var(--bg)}
  .part{background-color:var(--bg2)}
  pre{background-color:var(--field)}
}
@media (forced-colors:active){*{forced-color-adjust:none}}
@media (inverted-colors:inverted){html{filter:invert(1) hue-rotate(180deg)} img,video,canvas{filter:invert(1) hue-rotate(180deg)}}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto;padding:28px 24px 80px}
aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-weight:400;font-size:42px;line-height:1;margin:6px 0 6px;letter-spacing:-.01em}
.brand .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
nav ol{list-style:none;margin:0;padding:0}
nav > ol > li{margin-bottom:10px}
nav a{display:block;padding:4px 10px;border-radius:3px;color:var(--ink);text-decoration:none;font-family:var(--mono);font-size:12px;line-height:1.35}
nav a:hover{background:var(--bg3)}
nav a.top{font-size:12.5px;font-weight:500;color:var(--ink);border-left:2px solid var(--or);border-radius:0 3px 3px 0}
nav li li a{color:var(--muted);padding-left:14px}
nav a:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.note{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px}

main{min-width:0;display:flex;flex-direction:column;gap:28px}
.part{background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:28px 36px 36px}
.src{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
h1,h2,h3{font-weight:400;line-height:1.15}
.part h1{font-size:40px;margin:0 0 14px}
.part h2{font-size:30px;margin:40px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
.part h3{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);margin:26px 0 8px}
p{margin:0 0 12px}
a{color:var(--ink);text-decoration-color:var(--or-line);text-underline-offset:3px}
a:hover{text-decoration-color:var(--or)}
strong{font-weight:600}
ul,ol{padding-left:22px;margin:0 0 14px}
li{margin:3px 0}
li.todo{list-style:none;position:relative}
li.todo::before{content:"";position:absolute;left:-20px;top:.45em;width:10px;height:10px;border:1.5px solid var(--or);border-radius:2px}
code{font-family:var(--mono);font-size:.78em;background:var(--bg3);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
p,li,td{overflow-wrap:break-word}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--field);border:1px solid var(--line);border-left:3px solid var(--or);border-radius:3px;padding:12px 14px;overflow-x:auto;margin:0 0 16px;white-space:pre}
pre code{background:none;padding:0;font-size:inherit}
hr{display:none}
.tw{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.4}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;background:var(--bg3)}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}

@media (max-width:820px){
  body{font-size:17.5px}
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding:16px 16px 60px}
  aside{position:static;max-height:none;overflow:visible}
  nav li li{display:none}
  nav > ol{display:flex;flex-wrap:wrap;gap:6px}
  nav > ol > li{margin:0}
  .part{padding:20px 16px 24px}
  .part h1{font-size:32px}
  .part h2{font-size:25px}
  td:first-child{white-space:normal}
  pre{font-size:11.5px}
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <div class="eyebrow">NIRVALAB · Science Centre Singapore</div>
      <h1>Second Earth</h1>
      <div class="meta">Brief de reprise · {{DATE}}</div>
    </div>
    <nav><ol>{{NAV}}</ol></nav>
    <div class="note">Cette page reprend CLAUDE.md et les trois fichiers de site-spec/ contenus dans le zip. C'est CLAUDE.md que la nouvelle session lit en premier.</div>
  </aside>
  <main>
{{BODY}}
  </main>
</div>
</body>
</html>
